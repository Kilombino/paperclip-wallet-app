name: Beta platform packages
on:
  workflow_dispatch:
    inputs:
      base_run:
        description: Successful Beta wallet images run ID
        required: true
        type: string
permissions:
  contents: read
  packages: write
  actions: read
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Validate base build and wait for completion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_RUN: ${{ inputs.base_run }}
        run: |
          [[ "$BASE_RUN" =~ ^[0-9]+$ ]]
          test "$(gh run view "$BASE_RUN" --json workflowName --jq .workflowName)" = 'Beta wallet images'
          gh run watch "$BASE_RUN" --exit-status --interval 30
          gh run download "$BASE_RUN" -n paperclip-beta-package-sources -D base
          grep -Eq '^ghcr.io/connorslab/paperclip-wallet-app:beta-[0-9]+@sha256:[a-f0-9]{64}$' base/image.txt
      - name: Check adapter and package contracts
        run: |
          python3 -m unittest discover -s deployment -p test_managed_chain.py
          python3 -m unittest discover -s deployment -p test_pruned_rpc.py
          python3 -m unittest discover -s deployment -p test_package.py
          python3 -m unittest discover -s deployment -p test_container.py
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build bundled adapter images
        env:
          IMAGE: ghcr.io/connorslab/paperclip-wallet-app
          RUN_ID: ${{ github.run_id }}
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 -f deployment/Dockerfile.adapter --build-arg "BASE_IMAGE=$(cat base/image.txt)" --label "org.opencontainers.image.source=https://github.com/connorslab/paperclip-wallet-app" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$IMAGE:beta-bundled-$RUN_ID" --push .
          digest=$(docker buildx imagetools inspect "$IMAGE:beta-bundled-$RUN_ID" --format '{{json .Manifest.Digest}}' | tr -d '"')
          mkdir -p dist
          printf '%s:beta-bundled-%s@%s\n' "$IMAGE" "$RUN_ID" "$digest" > dist/image.txt
          for arch in amd64 arm64; do
            docker run -d --name wallet-$arch --platform linux/$arch --network none --tmpfs /data:uid=1000,gid=1000,mode=0700 "$(cat dist/image.txt)"
            for attempt in $(seq 1 30); do
              if docker exec wallet-$arch python3 /usr/local/lib/paperclip/health.py; then break; fi
              sleep 2
            done
            docker exec wallet-$arch python3 /usr/local/lib/paperclip/health.py
            docker exec wallet-$arch python3 -c "from pathlib import Path; assert Path('/usr/local/lib/paperclip/pruned_rpc.py').is_file()"
            docker rm -f wallet-$arch
          done
          python3 deployment/package.py umbrel --image "$(cat dist/image.txt)" --output dist/umbrel/paperclip-wallet
          printf 'id: paperclip\nname: Paperclip Beta\n' > dist/umbrel/umbrel-app-store.yml
      - uses: actions/upload-artifact@v4
        with:
          name: paperclip-bundled-packages
          path: dist
