name: Publish verified wallet images
on:
  workflow_dispatch:
    inputs:
      amd64_only:
        type: boolean
        default: false
      amd64_sha256:
        required: true
        type: string
      arm64_sha256:
        required: false
        type: string
permissions:
  contents: write
  packages: write
jobs:
  publish:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.amd64_only && '{"include":[{"arch":"amd64","runner":"ubuntu-24.04"}]}' || '{"include":[{"arch":"amd64","runner":"ubuntu-24.04"},{"arch":"arm64","runner":"ubuntu-24.04-arm"}]}') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify reviewed archive and publish
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
          EXPECTED: ${{ matrix.arch == 'amd64' && inputs.amd64_sha256 || inputs.arm64_sha256 }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED" =~ ^[0-9a-f]{64}$ ]]
          gh release download v0.9.1-beta.1 -R "$GITHUB_REPOSITORY" -p "wallet-$ARCH.tar.gz"
          printf '%s  %s\n' "$EXPECTED" "wallet-$ARCH.tar.gz" | sha256sum -c -
          docker load -i "wallet-$ARCH.tar.gz"
          build=40789384982
          if [ "$ARCH" = arm64 ]; then build=40786311361; fi
          source="ghcr.io/connorslab/paperclip-wallet-app:hotfix-$build-$ARCH"
          docker image inspect "$source" > image.json
          docker run --rm --network none --entrypoint paperclip-wallet "$source" --version | grep -F '0.9.1'
          docker run --rm --network none -v "$PWD:/tests:ro" --entrypoint python3 "$source" /tests/deployment/test_daemon.py
          target="ghcr.io/connorslab/paperclip-wallet-app:0.9.1-$ARCH"
          docker tag "$source" "$target"
          docker push "$target"
  manifest:
    if: ${{ !inputs.amd64_only }}
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-platform release image
        run: |
          set -euo pipefail
          image=ghcr.io/connorslab/paperclip-wallet-app
          docker buildx imagetools create -t "$image:0.9.1" "$image:0.9.1-amd64" "$image:0.9.1-arm64"
          docker buildx imagetools inspect "$image:0.9.1" > image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-image
          path: image.txt
