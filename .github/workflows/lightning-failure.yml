name: Lightning failure regression checks
on:
  workflow_dispatch:
  push:
    branches: ['fix/lightning-failed-payment-costs']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: actions/cache/restore@v4
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-lnfix-${{ hashFiles('Cargo.lock', 'flake.lock') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-lnfix-${{ hashFiles('Cargo.lock', 'flake.lock') }}-
      - run: sha256sum -c SHARED-SOURCE.sha256
      - run: nix develop .#build --command cargo check --locked -p bark-wallet -p bark-json -p bark-rest --tests --features onchain-bdk
      - run: nix develop .#build --command just unit-wallet lightning
      - run: nix develop .#build --command just unit funded_lightning
      - run: nix develop .#build --command just unit lightning_send_lifetime
      - name: Generate API documentation
        run: nix develop .#build --command cargo run --locked -p bark-rest --example dump_api_docs > bark-rest/openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: bark-rest/openapi.json
      - uses: actions/cache/save@v4
        if: always() && !cancelled()
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-lnfix-${{ hashFiles('Cargo.lock', 'flake.lock') }}-${{ github.sha }}
